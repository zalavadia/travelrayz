<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('travelrayz-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script>document.documentElement.classList.add("is-loading");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trips | TRAVELRAYZ — Treks, Yatras &amp; Corporate Outings</title>
  <meta name="description" content="Browse TRAVELRAYZ trips — corporate treks, team outings, spiritual yatras, weekend getaways and premium tours. Live calendar with limited seats.">
  <meta name="keywords" content="TRAVELRAYZ trips, corporate outings, treks Mumbai, Jyotirlinga yatra, weekend trips, team building">
  <meta name="author" content="TRAVELRAYZ">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.travelrayz.com/trips.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trips | TRAVELRAYZ">
  <meta property="og:description" content="Live departures from our trip calendar — curated routes, trusted guides, and limited seats.">
  <meta property="og:image" content="https://www.travelrayz.com/assets/images/maharashtra-3-jyotirlinga-poster.png">
  <meta property="og:url" content="https://www.travelrayz.com/trips.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Trips | TRAVELRAYZ">
  <meta name="twitter:description" content="Explore treks, yatras, corporate outings and weekend trips with TRAVELRAYZ.">
  <meta name="twitter:image" content="https://www.travelrayz.com/assets/images/maharashtra-3-jyotirlinga-poster.png">
  <link rel="icon" href="assets/images/logo-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/loader-critical.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="trips">
  <div class="page-loader" id="page-loader" role="status" aria-live="polite" aria-label="Loading TRAVELRAYZ">
    <div class="page-loader-inner">
      <span class="page-loader-ring" aria-hidden="true"></span>
      <img class="page-loader-logo" src="assets/images/logo-mark.png" alt="" width="120" height="120">
    </div>
  </div>
  <script src="assets/js/loader.js"></script>

  <a class="skip-link" href="#main">Skip to content</a>

  <div id="site-nav"></div>

  <main id="main" class="page-reveal">
    <section class="page-hero page-hero--trips" data-hero="trips">
      <div class="container page-hero-inner">
        <div class="page-hero-copy">
          <p class="page-hero-badge">Live calendar</p>
          <h1>
            <span class="ph-line">Upcoming</span>
            <span class="ph-line ph-accent">Trips</span>
          </h1>
          <p class="page-hero-desc">Upcoming departures from our live calendar. Corporate outings, treks, yatras and weekend escapes with trusted guides and limited seats.</p>
        </div>
      </div>
      <div class="page-hero-line" aria-hidden="true"></div>
    </section>

    <section class="section">
      <div class="container">
        <div class="trips-toolbar">
          <div class="search-box">
            <span class="search-box__glyph" aria-hidden="true">⌕</span>
            <input type="search" id="trip-search" placeholder="Find a trip by name or destination…" autocomplete="off" aria-label="Search trips by title or location">
            <span class="search-box__trail" aria-hidden="true"></span>
          </div>
        </div>

        <div id="trips-error" class="error-state hidden" role="alert">
          <img src="assets/images/logo-mark.png" alt="" width="48" height="48" class="trips-error-logo">
          <p id="trips-error-msg">Could not load trips from the calendar.</p>
          <button type="button" class="btn btn-primary" id="trips-retry">Try again</button>
        </div>

        <div class="trips-grid" id="trips-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <div class="modal-overlay" id="trip-modal" aria-hidden="true"></div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script src="assets/js/sheets.js" defer></script>
  <script src="assets/js/trips.js" defer></script>
  <script src="assets/js/animations.js" defer></script>
  <script src="assets/js/chrome.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
